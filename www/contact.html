<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | LukeMonroe.dev</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./styles/guide.css">
  <script>
    if (localStorage.getItem('theme') === 'hacker') {
      document.documentElement.setAttribute('data-theme', 'hacker');
    }
  </script>
</head>
<body>
  <nav>
    <div class="nav-brand">Get In Touch</div>
    <div class="nav-links">
      <a href="./">Home</a>
      <a href="./links">Links</a>
      <a href="./contact">Contact</a>
      <button id="hacker-toggle" class="btn theme-toggle" type="button" aria-label="Switch to hacker mode" title="Switch to hacker mode">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
      </button>
    </div>
  </nav>

  <main class="contact-page">

    <h1>Contact Me</h1>
    <p>If you would like to get in touch with me, please feel free to reach out via email or connect with me on LinkedIn. I look forward to hearing from you!</p>

    <div class="contact-info">
      <p>Email: <a href="mailto:hello@lukemonroe.dev">hello@lukemonroe.dev</a></p>
      <p>LinkedIn: <a href="https://www.linkedin.com/in/luke-monroe-0b3631381/" target="_blank" rel="noopener noreferrer">linkedin.com/in/lukemonroe-0b3631381</a></p>
    </div>
  </main>

  <script>
    const toggleBtn = document.getElementById('hacker-toggle');
    const toggleIcon = toggleBtn.querySelector('i');

    const updateThemeUI = (isHacker) => {
      toggleIcon.className = isHacker ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      toggleBtn.setAttribute('aria-label', isHacker ? 'Switch to light mode' : 'Switch to hacker mode');
      toggleBtn.setAttribute('title', isHacker ? 'Switch to light mode' : 'Switch to hacker mode');
    };

    if (localStorage.getItem('theme') === 'hacker') {
      document.body.setAttribute('data-theme', 'hacker');
      updateThemeUI(true);
    }

    toggleBtn.addEventListener('click', () => {
      const isHacker = document.body.getAttribute('data-theme') === 'hacker' || document.documentElement.getAttribute('data-theme') === 'hacker';
      if (isHacker) {
        document.body.removeAttribute('data-theme');
        document.documentElement.removeAttribute('data-theme');
        localStorage.removeItem('theme');
        updateThemeUI(false);
      } else {
        document.body.setAttribute('data-theme', 'hacker');
        document.documentElement.setAttribute('data-theme', 'hacker');
        localStorage.setItem('theme', 'hacker');
        updateThemeUI(true);
      }
    });
  </script>
</body>
</html>
